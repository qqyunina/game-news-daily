<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>休閒遊戲早報 ☕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: #f5f0eb;
      color: #2c2c2c;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 3px solid #e8d5c4;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .header-left h1 { font-size: 1.5rem; font-weight: 700; color: #5a3e2b; }
    .header-left .subtitle { font-size: 0.82rem; color: #9e8878; margin-top: 2px; }

    .header-right { display: flex; align-items: center; gap: 12px; }

    #date-display {
      font-size: 0.85rem; color: #9e8878;
      background: #f5f0eb; padding: 6px 14px; border-radius: 20px;
    }

    .main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

    .source-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }

    .filter-btn {
      padding: 5px 16px; border-radius: 20px;
      border: 1.5px solid #d4bfa8; background: #fff;
      color: #7a5c44; font-size: 0.8rem; font-family: inherit;
      cursor: pointer; transition: all 0.15s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #c47a3a; border-color: #c47a3a; color: #fff;
    }

    .section-title {
      font-size: 1rem; font-weight: 700; color: #5a3e2b;
      margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 2px solid #e8d5c4;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    .source-section { margin-bottom: 36px; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
    }

    .card {
      background: #fff; border-radius: 12px; padding: 16px 18px;
      border: 1px solid #e8d5c4; transition: box-shadow 0.15s, transform 0.15s;
      display: flex; flex-direction: column; gap: 8px;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); transform: translateY(-2px); }

    .card-source {
      font-size: 0.72rem; font-weight: 700; padding: 2px 8px;
      border-radius: 10px; color: #fff; display: inline-block; width: fit-content;
    }
    .card-title { font-size: 0.92rem; font-weight: 500; line-height: 1.5; color: #2c2c2c; }
    .card-title:hover { color: #c47a3a; }
    .card-date { font-size: 0.75rem; color: #b0998a; }
    .card-desc {
      font-size: 0.8rem; color: #7a6a60; line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    .loading { text-align: center; padding: 60px 20px; color: #9e8878; font-size: 0.95rem; }
    .loading .spinner {
      width: 32px; height: 32px; border: 3px solid #e8d5c4;
      border-top-color: #c47a3a; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: #fff3f0; border: 1px solid #f5c6c0; border-radius: 10px;
      padding: 12px 16px; font-size: 0.82rem; color: #c0392b; margin-top: 8px;
    }
    .empty-state { text-align: center; color: #b0998a; padding: 30px; font-size: 0.88rem; }

    #status-bar { text-align: center; font-size: 0.78rem; color: #b0998a; margin-bottom: 20px; }

    .update-info {
      text-align: center; font-size: 0.78rem; color: #b0998a;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>🐱 休閒遊戲早報</h1>
    <div class="subtitle">miniworld 產品組 · 每日市場情報</div>
  </div>
  <div class="header-right">
    <div id="date-display">載入中…</div>
  </div>
</header>

<div class="main">
  <div id="update-info" class="update-info"></div>
  <div id="status-bar"></div>

  <div class="source-filter" id="filter-bar">
    <button class="filter-btn active" onclick="filterSource('all', this)">全部</button>
  </div>

  <div id="content">
    <div class="loading"><div class="spinner"></div>載入今日早報…</div>
  </div>
</div>

<script>
let allData = [];
let activeFilter = 'all';

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function renderCard(item, source) {
  return `
    <div class="card">
      <span class="card-source" style="background:${source.color}">${source.name}</span>
      <a href="${item.link}" target="_blank" rel="noopener">
        <div class="card-title">${item.title || '(無標題)'}</div>
      </a>
      ${item.desc ? `<div class="card-desc">${item.desc}</div>` : ''}
      <div class="card-date">${formatDate(item.date)}</div>
    </div>`;
}

function renderAll() {
  const content = document.getElementById('content');
  const sources = activeFilter === 'all'
    ? allData
    : allData.filter(r => r.source.id === activeFilter);

  let html = '';
  let totalCount = 0;

  for (const result of sources) {
    const s = result.source;
    html += `<div class="source-section">`;
    html += `<div class="section-title"><span class="dot" style="background:${s.color}"></span>${s.name}</div>`;

    if (!result.ok) {
      html += `<div class="error-msg">今日無法抓取資料</div>`;
    } else if (!result.items || result.items.length === 0) {
      html += `<div class="empty-state">今日無新文章</div>`;
    } else {
      html += `<div class="cards-grid">`;
      result.items.forEach(item => { html += renderCard(item, s); totalCount++; });
      html += `</div>`;
    }
    html += `</div>`;
  }

  content.innerHTML = html || '<div class="empty-state">沒有內容</div>';
  document.getElementById('status-bar').textContent = `共 ${totalCount} 篇文章`;
}

function filterSource(id, btn) {
  activeFilter = id;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function buildFilterBar(sources) {
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = `<button class="filter-btn active" onclick="filterSource('all', this)">全部</button>`;
  sources.forEach(r => {
    const s = r.source;
    bar.innerHTML += `<button class="filter-btn" onclick="filterSource('${s.id}', this)">${s.name}</button>`;
  });
}

async function loadData() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    if (!res.ok) throw new Error('data.json not found');
    const json = await res.json();
    allData = json.sources || [];

    if (json.updated) {
      const d = new Date(json.updated);
      const twTime = new Date(d.getTime() + 8 * 60 * 60 * 1000);
      document.getElementById('update-info').textContent =
        `資料更新時間：${twTime.getUTCFullYear()}/${String(twTime.getUTCMonth()+1).padStart(2,'0')}/${String(twTime.getUTCDate()).padStart(2,'0')} ${String(twTime.getUTCHours()).padStart(2,'0')}:${String(twTime.getUTCMinutes()).padStart(2,'0')} (台灣時間)`;
    }

    buildFilterBar(allData);
    renderAll();
  } catch(e) {
    document.getElementById('content').innerHTML =
      `<div class="error-msg">⚠️ 尚未有資料 — 請等 GitHub Actions 第一次執行完成（通常在每天早上 09:00）<br><br>或者你可以手動觸發：去 GitHub repo → Actions → Fetch Game News → Run workflow</div>`;
  }
}

// 日期顯示
const today = new Date();
const weekdays = ['日','一','二','三','四','五','六'];
document.getElementById('date-display').textContent =
  `${today.getFullYear()}/${String(today.getMonth()+1).padStart(2,'0')}/${String(today.getDate()).padStart(2,'0')} 週${weekdays[today.getDay()]}`;

loadData();
</script>

</body>
</html>
