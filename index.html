<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning Briefing ☕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* editorial meadow — refined paper & forest */
      --paper:      #f6f4ec;
      --paper-2:    #fbfaf4;
      --card:       #fffdf7;
      --ink:        #1f261c;
      --ink-dim:    #555c4d;
      --ink-soft:   #8a907e;
      --line:       #e3e0d4;
      --line-2:     #d6d2c3;
      --brand:      #2f7a3e;     /* deep forest */
      --brand-deep: #1f5a2c;
      --gold:       #a9803a;     /* refined amber */

      --serif: 'Newsreader', 'Noto Serif TC', Georgia, serif;
      --cjk-serif: 'Noto Serif TC', 'Newsreader', serif;
      --sans: 'Noto Sans TC', system-ui, sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 48px); }

    /* ---------- MASTHEAD ---------- */
    .masthead { padding-top: clamp(28px, 5vw, 52px); }
    .edition {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--ink-soft); padding-bottom: 12px;
      border-bottom: 1px solid var(--line-2);
    }
    .edition span { white-space: nowrap; }
    .edition .e-right { color: var(--brand); letter-spacing: .6px; }
    @media (max-width: 540px) {
      .edition { font-size: 10.5px; letter-spacing: .6px; }
    }
    .title-row { text-align: center; padding: clamp(22px, 4vw, 38px) 0 clamp(18px, 3vw, 26px); position: relative; }
    .kicker {
      font-size: 12px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
      color: var(--gold); margin-bottom: 14px;
    }
    .masthead h1 {
      font-family: var(--cjk-serif); font-weight: 700;
      font-size: clamp(30px, 5.2vw, 46px); line-height: 1; color: var(--ink);
      letter-spacing: 2px;
    }
    .lede {
      font-family: var(--serif); font-style: italic; font-size: clamp(15px, 2.2vw, 18px);
      color: var(--ink-dim); margin-top: 16px;
    }
    .rule-double {
      border-top: 3px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      height: 5px; margin-top: clamp(18px, 3vw, 26px);
    }
    #date-display { font-variant-numeric: tabular-nums; }

    /* ---------- BRIEF (insights) ---------- */
    .brief-zone { padding-top: clamp(28px, 4vw, 40px); }
    .brief {
      background: var(--card);
      border: 1px solid var(--line);
      padding: clamp(26px, 3.6vw, 40px);
      margin-bottom: 20px;
      position: relative;
    }
    .brief + .brief { margin-top: 0; }
    .brief-head {
      display: flex; align-items: baseline; gap: 14px;
      padding-bottom: 18px; margin-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }
    .brief-head .b-no {
      font-family: var(--serif); font-size: 13px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: var(--gold); white-space: nowrap;
    }
    .brief.actions .brief-head .b-no { color: var(--brand); }
    .brief-head h2 {
      font-family: var(--cjk-serif); font-weight: 600;
      font-size: clamp(19px, 2.8vw, 25px); color: var(--ink); line-height: 1.25;
      letter-spacing: .3px;
    }
    .brief-list { list-style: none; display: flex; flex-direction: column; }
    .brief-list li {
      display: flex; gap: 18px; align-items: flex-start;
      padding: 16px 0; border-top: 1px solid var(--line);
      font-size: 15.5px; line-height: 1.72; font-weight: 400; color: var(--ink-dim);
      text-wrap: pretty;
    }
    .brief-list li:first-child { border-top: none; padding-top: 0; }
    .brief-list li:last-child { padding-bottom: 0; }
    .brief-list li .idx {
      flex-shrink: 0; font-family: var(--serif); font-size: 24px; font-weight: 500;
      line-height: 1; color: var(--gold); width: 34px; text-align: right;
      font-variant-numeric: lining-nums;
    }
    .brief.actions .brief-list li .idx { color: var(--brand); }
    .brief-list b, .brief-list strong { color: var(--ink); font-weight: 700; }
    .brief-list a { color: var(--brand-deep); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--brand) 40%, transparent); font-weight: 600; }
    .brief-list a:hover { background: color-mix(in srgb, var(--brand) 9%, transparent); }

    /* ---------- TOOLBAR ---------- */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
      padding: clamp(30px, 4vw, 44px) 0 18px;
      border-bottom: 1px solid var(--line-2);
      margin-bottom: clamp(26px, 3vw, 36px);
    }
    #status-bar {
      font-family: var(--serif); font-size: 14px; font-style: italic; color: var(--ink-soft);
    }
    #status-bar b { font-style: normal; font-weight: 600; color: var(--ink); }
    .source-filter { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      padding: 7px 15px; border-radius: 999px;
      border: 1px solid var(--line-2); background: transparent;
      color: var(--ink-dim); font-size: 12.5px; font-weight: 700; font-family: var(--sans);
      letter-spacing: .3px; cursor: pointer; transition: .15s; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .filter-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
    .filter-btn.active {
      background: var(--ink); border-color: var(--ink); color: var(--paper-2);
    }
    .filter-btn .fdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

    /* ---------- SECTIONS ---------- */
    .source-section { margin-bottom: clamp(40px, 5vw, 56px); }
    .section-title {
      display: flex; align-items: baseline; gap: 12px;
      padding-bottom: 12px; margin-bottom: 22px;
      border-bottom: 2px solid var(--ink);
    }
    .section-title .s-kicker {
      font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      color: var(--ink-soft);
    }
    .section-title .s-name {
      font-family: var(--cjk-serif); font-weight: 600; font-size: clamp(18px, 2.4vw, 22px);
      color: var(--ink); line-height: 1;
    }
    .section-title .s-dot { width: 9px; height: 9px; border-radius: 50%; align-self: center; }
    .section-title .count {
      margin-left: auto; font-family: var(--serif); font-style: italic;
      font-size: 14px; color: var(--ink-soft); white-space: nowrap; flex-shrink: 0;
    }

    /* ---------- RANKINGS ---------- */
    .ranks {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px; margin-bottom: clamp(40px, 5vw, 56px);
    }
    .rankcol { border: 1px solid var(--line); background: var(--card); padding: 24px 26px; }
    .rankcol h3 {
      font-family: var(--cjk-serif); font-weight: 600; font-size: 18px; color: var(--ink);
      padding-bottom: 14px; margin-bottom: 4px; border-bottom: 1px solid var(--line);
    }
    .rank-list { list-style: none; }
    .rank-row { display: flex; align-items: center; gap: 13px; padding: 10px 0; border-top: 1px solid var(--line); }
    .rank-row:first-child { border-top: none; }
    .rank-row .rk-no {
      flex-shrink: 0; font-family: var(--serif); font-size: 19px; font-weight: 600;
      color: var(--ink-soft); width: 26px; text-align: right; font-variant-numeric: lining-nums;
    }
    .rank-row.top .rk-no { color: var(--gold); }
    .rank-row img { width: 42px; height: 42px; border-radius: 9px; flex-shrink: 0; background: var(--paper); object-fit: cover; }
    .rank-row a.rk-meta { min-width: 0; display: flex; flex-direction: column; text-decoration: none; flex: 1; }
    .rank-row .rk-name { font-size: 14.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank-row a:hover .rk-name { color: var(--brand-deep); }
    .rank-row .rk-artist { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

    /* ---------- CARDS ---------- */
    .cards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 1px; background: var(--line);
      border: 1px solid var(--line);
    }
    .card {
      background: var(--paper-2); padding: 22px 24px 20px;
      display: flex; flex-direction: column; gap: 11px;
      transition: background .18s;
    }
    .card:hover { background: var(--card); }
    .card-source {
      font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
      display: inline-flex; align-items: center; gap: 7px; width: fit-content;
    }
    .card-source .cs-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .card a { text-decoration: none; }
    .card-title {
      font-family: var(--serif); font-weight: 500; font-size: 20px; line-height: 1.32;
      color: var(--ink); transition: color .15s; text-wrap: pretty;
      letter-spacing: -.1px;
    }
    .card a:hover .card-title { color: var(--brand-deep); }
    .card-title-en { font-family: var(--sans); font-size: 12px; color: var(--ink-soft); line-height: 1.45; margin-top: 5px; }
    .card-desc {
      font-size: 13.5px; color: var(--ink-dim); line-height: 1.66; font-weight: 400;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-date {
      font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--ink-soft); margin-top: auto; padding-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- STATES ---------- */
    .loading { text-align: center; padding: 80px 20px; color: var(--ink-soft); font-family: var(--serif); font-style: italic; font-size: 17px; }
    .loading .spinner {
      width: 34px; height: 34px; border: 2px solid var(--line-2);
      border-top-color: var(--brand); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      border: 1px solid var(--line); border-left: 3px solid var(--gold);
      padding: 14px 18px; font-size: 13.5px; font-weight: 500; color: var(--gold);
      background: var(--card);
    }
    .empty-state { color: var(--ink-soft); padding: 26px 0; font-family: var(--serif); font-style: italic; font-size: 16px; }

    .global-error {
      border: 1px solid var(--line); background: var(--card);
      padding: 48px 36px; text-align: center; max-width: 560px; margin: 40px auto;
    }
    .global-error .ge-ico { font-family: var(--cjk-serif); font-size: 34px; color: var(--brand); margin-bottom: 14px; }
    .global-error .ge-t { font-family: var(--cjk-serif); font-size: 21px; font-weight: 600; color: var(--ink); margin-bottom: 12px; }
    .global-error .ge-s { font-size: 14px; font-weight: 400; color: var(--ink-dim); line-height: 1.8; }

    .foot {
      max-width: 1080px; margin: 0 auto; padding: clamp(30px, 4vw, 48px) clamp(20px, 5vw, 48px) 48px;
      text-align: center; border-top: 1px solid var(--line-2); margin-top: 20px;
    }
    .foot .f-mark { font-family: var(--cjk-serif); font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: 1px; }
    .foot .f-sub { font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-soft); margin-top: 8px; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div class="edition">
      <span>每日市場情報</span>
      <span class="e-right" id="date-display">載入中…</span>
    </div>
    <div class="title-row">
      <div class="kicker">Casual Games · Morning Brief</div>
      <h1>Morning Briefing</h1>
      <div class="lede">每日精選全球休閒遊戲市場情報，為產品團隊整理市場新知與洞察。</div>
    </div>
    <div class="rule-double"></div>
  </div>

  <div class="brief-zone">
    <div id="update-info" class="error-msg" style="display:none;border-left-color:var(--brand);color:var(--ink-dim);font-weight:600"></div>

    <div class="brief" id="insights-box" style="display:none">
      <div class="brief-head">
        <span class="b-no">No. 01 · 市場新知</span>
        <h2>今天可以學習到的休閒遊戲市場新知</h2>
      </div>
      <ul class="brief-list" id="insights-list"></ul>
    </div>

    <div class="brief actions" id="actions-box" style="display:none">
      <div class="brief-head">
        <span class="b-no">No. 02 · 行動方向</span>
        <h2>結合市場趨勢，我們可以優化的方向</h2>
      </div>
      <ul class="brief-list" id="actions-list"></ul>
    </div>
  </div>

  <div id="rankings"></div>

  <div class="toolbar">
    <div id="status-bar"></div>
    <div class="source-filter" id="filter-bar">
      <button class="filter-btn active" onclick="filterSource('all', this)">全部</button>
    </div>
  </div>

  <div id="content">
    <div class="loading"><div class="spinner"></div>載入今日早報…</div>
  </div>
</div>

<div class="foot">
  <div class="f-mark">Morning Briefing</div>
  <div class="f-sub">每日自動更新</div>
</div>

<script>
let allData = [];
let activeFilter = 'all';

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function renderCard(item, source) {
  const zh = item.title_zh && item.title_zh.trim();
  const mainTitle = zh || item.title || '(無標題)';
  const enSub = (zh && item.title) ? `<div class="card-title-en">${item.title}</div>` : '';
  return `
    <div class="card">
      <span class="card-source" style="color:${source.color}"><span class="cs-dot" style="background:${source.color}"></span>${source.name}</span>
      <a href="${item.link}" target="_blank" rel="noopener">
        <div class="card-title">${mainTitle}</div>
        ${enSub}
      </a>
      ${item.desc ? `<div class="card-desc">${item.desc}</div>` : ''}
      ${item.date ? `<div class="card-date">${formatDate(item.date)}</div>` : ''}
    </div>`;
}

function renderAll() {
  const content = document.getElementById('content');
  const sources = activeFilter === 'all'
    ? allData
    : allData.filter(r => r.source.id === activeFilter);

  let html = '';
  let totalCount = 0;

  for (const result of sources) {
    const s = result.source;
    const items = (result.ok && result.items) ? result.items : [];
    html += `<div class="source-section">`;
    html += `<div class="section-title">
        <span class="s-dot" style="background:${s.color}"></span>
        <span class="s-name">${s.name}</span>
        ${items.length ? `<span class="count">${items.length} 篇精選</span>` : ''}
      </div>`;

    if (!result.ok) {
      html += `<div class="error-msg">今日無法抓取資料</div>`;
    } else if (items.length === 0) {
      html += `<div class="empty-state">今日無新文章。</div>`;
    } else {
      html += `<div class="cards-grid">`;
      items.forEach(item => { html += renderCard(item, s); totalCount++; });
      html += `</div>`;
    }
    html += `</div>`;
  }

  content.innerHTML = html || '<div class="empty-state">沒有內容</div>';
  document.getElementById('status-bar').innerHTML = `今日共 <b>${totalCount}</b> 篇精選文章`;
}

function filterSource(id, btn) {
  activeFilter = id;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

// 支援字串，或 {title, detail} 物件（優化方向用後者）
function fmtPoint(p) {
  if (p && typeof p === 'object') {
    const t = p.title ? `<b>${p.title}</b>` : '';
    const sep = (p.title && p.detail) ? '——' : '';
    return t + sep + (p.detail || '');
  }
  return p;
}

function buildList(boxId, listId, points) {
  const box = document.getElementById(boxId);
  const list = document.getElementById(listId);
  if (!points || points.length === 0) { box.style.display = 'none'; return; }
  list.innerHTML = points.map((p, i) => `<li><span class="idx">${i+1}</span><span>${fmtPoint(p)}</span></li>`).join('');
  box.style.display = 'block';
}

function buildRankings(rankings) {
  const wrap = document.getElementById('rankings');
  if (!wrap) return;
  if (!rankings || rankings.length === 0) { wrap.innerHTML = ''; return; }
  let html = `<div class="section-title"><span class="s-kicker">App Store · Taiwan</span><span class="s-name">休閒遊戲排行榜</span></div><div class="ranks">`;
  for (const b of rankings) {
    html += `<div class="rankcol"><h3>${b.title}</h3><ul class="rank-list">`;
    (b.items || []).forEach(it => {
      const topCls = it.rank <= 3 ? 'rank-row top' : 'rank-row';
      const icon = it.icon ? `<img src="${it.icon}" alt="" loading="lazy">` : '';
      const open = it.link ? `href="${it.link}" target="_blank" rel="noopener"` : '';
      html += `<li class="${topCls}"><span class="rk-no">${it.rank}</span>${icon}<a class="rk-meta" ${open}><span class="rk-name">${it.name || ''}</span><span class="rk-artist">${it.artist || ''}</span></a></li>`;
    });
    html += `</ul></div>`;
  }
  html += `</div>`;
  wrap.innerHTML = html;
}

function buildFilterBar(sources) {
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = `<button class="filter-btn active" onclick="filterSource('all', this)">全部</button>`;
  sources.forEach(r => {
    const s = r.source;
    bar.innerHTML += `<button class="filter-btn" onclick="filterSource('${s.id}', this)">
        <span class="fdot" style="background:${s.color}"></span>${s.name}
      </button>`;
  });
}

async function loadData() {
  try {
    let res = await fetch('data.json?t=' + Date.now()).catch(() => null);
    if (!res || !res.ok) res = await fetch('data.json');   // fallback if cache-bust query is blocked
    if (!res.ok) throw new Error('data.json not found');
    const json = await res.json();
    allData = json.sources || [];

    if (json.updated) {
      const d = new Date(json.updated);
      const twTime = new Date(d.getTime() + 8 * 60 * 60 * 1000);
      const ui = document.getElementById('update-info');
      ui.textContent =
        `資料更新時間：${twTime.getUTCFullYear()}/${String(twTime.getUTCMonth()+1).padStart(2,'0')}/${String(twTime.getUTCDate()).padStart(2,'0')} ${String(twTime.getUTCHours()).padStart(2,'0')}:${String(twTime.getUTCMinutes()).padStart(2,'0')} (台灣時間)`;
      ui.style.display = 'block';
    }

    buildFilterBar(allData);
    buildList('insights-box', 'insights-list', json.insights || []);
    buildList('actions-box', 'actions-list', json.opportunities || json.actions || []);
    buildRankings(json.rankings || []);
    renderAll();
  } catch(e) {
    document.getElementById('content').innerHTML =
      `<div class="global-error">
        <div class="ge-ico">☘</div>
        <div class="ge-t">尚未有今日資料</div>
        <div class="ge-s">每天早上 09:00 會自動更新；若還沒看到內容，請稍候再重新整理。</div>
      </div>`;
  }
}

// 日期顯示
const today = new Date();
const weekdays = ['日','一','二','三','四','五','六'];
document.getElementById('date-display').textContent =
  `${today.getFullYear()}年 ${String(today.getMonth()+1).padStart(2,'0')}月 ${String(today.getDate()).padStart(2,'0')}日 · 週${weekdays[today.getDay()]}`;

loadData();
</script>

</body>
</html>
